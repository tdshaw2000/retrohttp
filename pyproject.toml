[project]
name = "retrohttp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "brotli",
    "charset-normalizer",
    "beautifulsoup4",
    "lxml",
    "Pillow",
    # Browser engine for JavaScript-only pages; its Chromium build is a
    # separate one-time install (python -m playwright install chromium).
    "playwright",
]

[dependency-groups]
dev = ["pytest", "pyyaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["server*"]
