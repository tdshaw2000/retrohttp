[project]
name = "retrohttp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "brotli",
    "charset-normalizer",
    "beautifulsoup4",
    "lxml",
    "Pillow",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["server*"]
