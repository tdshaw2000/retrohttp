<!DOCTYPE html>
<html>
<head><title>Offline-first app</title></head>
<body>
<div id="root"></div>
<script>
  document.getElementById("root").innerHTML = "<p>Rendered by script</p>";
  if (navigator.serviceWorker) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }
</script>
</body>
</html>
